name: Daily Horizon Summary

on:
  schedule:
    # 12:47 UTC = 5:47 AM Los Angeles (PDT). Deliberately off the hour:
    # GitHub queues scheduled jobs on a best-effort basis and the top of
    # the hour is the most contended slot on the platform. Running at :00
    # was landing between 7:20 and 8:30 AM LA.
    - cron: '47 12 * * *'
  workflow_dispatch:       # Allow manual trigger at any time

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need history to find the last digest timestamp

      - name: Fetch gh-pages for the window calculation
        run: git fetch --no-tags --depth=50 origin gh-pages || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # Outlets with no RSS feed of their own (Mansion Global, Forbes, Luxe).
      # Writes docs/feeds/*.xml, which the next step reads via file:// URLs.
      # Never fails the run: a missing feed costs that outlet's articles for
      # the day, not the whole digest.
      - name: Build in-house feeds
        run: uv run python -m src.scrapers.sitefeed || echo "feed build had problems, continuing"

      # The lookback window must reach back to the PREVIOUS run, not a flat 24h.
      # GitHub runs scheduled jobs on a best-effort basis and routinely starts
      # this one 30-90 minutes late. Whenever two runs land more than 24h apart,
      # a flat --hours 24 never looks at the articles published in the overrun,
      # and nothing ever goes back for them. Measured on gh-pages: 7 of the 17
      # days after the 27 Jul rebuild lost time this way, 10 hours in total.
      - name: Work out the lookback window
        run: |
          LAST=$(git log -1 --format=%cI origin/gh-pages -- _posts 2>/dev/null || true)
          if [ -z "$LAST" ]; then
            HOURS=24
          else
            NOW=$(date -u +%s); THEN=$(date -u -d "$LAST" +%s)
            HOURS=$(( (NOW - THEN + 3599) / 3600 + 1 ))   # round up, +1h overlap
            [ "$HOURS" -lt 24 ] && HOURS=24
            [ "$HOURS" -gt 72 ] && HOURS=72               # cap after a long outage
          fi
          echo "Last digest: ${LAST:-none}. Looking back $HOURS hours."
          echo "HOURS=$HOURS" >> $GITHUB_ENV

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          PRESS_FEED_URL: ${{ secrets.PRESS_FEED_URL }}
          PRESS_FEED_TOKEN: ${{ secrets.PRESS_FEED_TOKEN }}
        run: uv run horizon --hours "${HOURS:-24}"

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
