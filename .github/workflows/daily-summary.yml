name: Daily Horizon Summary

on:
  schedule:
    # 12:47 UTC = 5:47 AM Los Angeles (PDT). Deliberately off the hour:
    # GitHub queues scheduled jobs on a best-effort basis and the top of
    # the hour is the most contended slot on the platform. Running at :00
    # was landing between 7:20 and 8:30 AM LA.
    - cron: '47 12 * * *'
  workflow_dispatch:       # Allow manual trigger at any time

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      # Outlets with no RSS feed of their own (Mansion Global, Forbes, Luxe).
      # Writes docs/feeds/*.xml, which the next step reads via file:// URLs.
      # Never fails the run: a missing feed costs that outlet's articles for
      # the day, not the whole digest.
      - name: Build in-house feeds
        run: uv run python -m src.scrapers.sitefeed || echo "feed build had problems, continuing"

      - name: Run Horizon
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          PRESS_FEED_URL: ${{ secrets.PRESS_FEED_URL }}
          PRESS_FEED_TOKEN: ${{ secrets.PRESS_FEED_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
